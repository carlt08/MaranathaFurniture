<!DOCTYPE html>
<html lang="en-ZA">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Cart | Maranatha Furnishers</title>
    <meta name="description" content="Review the furniture in your cart before sending an order request to Maranatha Furnishers.">
    <meta name="theme-color" content="#8a5a3b">
    <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="cart">
    <div id="site-header"></div>
    <noscript><p class="notice notice--warning container">This website needs JavaScript for the shopping cart. Please enable it, or contact us on WhatsApp or by phone.</p></noscript>

    <main id="main">
        <section class="page-hero">
            <div class="container">
                <h1 id="cart-heading" tabindex="-1">Your cart</h1>
                <p>Check your items, then continue to send an order request. Nothing is paid online.</p>
            </div>
        </section>
        <div class="container section section--tight">
            <div id="cart-root"><p class="loading">Loading your cart...</p></div>
        </div>
    </main>

    <div id="site-footer"></div>
    <script type="module" src="../js/cart.js"></script>
</body>
</html>
